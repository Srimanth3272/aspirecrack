<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock Test Image Extractor</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #121212; color: #fff; }
    input, button, select { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
    button { background: #fbbf24; color: #000; cursor: pointer; font-weight: bold; }
    button:hover { background: #f59e0b; }
    .log { background: #1e1e1e; padding: 10px; height: 300px; overflow-y: scroll; border-radius: 5px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; }
    .container { max-width: 800px; margin: 0 auto; }
  </style>
</head>
<body>
<div class="container">
  <h1>Mock Test Question Extractor</h1>
  <p>Select the folder containing your WhatsApp images. The script will use your Gemini API key to extract questions, group them by topic, and generate mock test JSON files (50 questions per mock).</p>
  
  <label>Gemini API Key:</label><br>
  <input type="password" id="apiKey" style="width: 100%;" placeholder="AIzaSy..."><br><br>
  
  <label>Topic for this folder:</label><br>
  <select id="topicName" style="width: 100%;">
    <option value="folk_dances">Folk Dances</option>
    <option value="festivals">Festivals</option>
    <option value="books_authors">Books & Authors</option>
    <option value="sports">Sports</option>
  </select><br><br>

  <label>Select Folder with Images:</label><br>
  <input type="file" id="folderInput" webkitdirectory directory multiple><br><br>

  <button id="startBtn">Start Extraction</button>
  <button id="downloadBtn" style="display:none; background: #10b981;">Download Generated JSONs</button>
  
  <div class="log" id="log">Waiting to start...</div>
</div>

<script>
  const logEl = document.getElementById('log');
  const allQuestions = [];
  
  function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  async function processImage(base64Image, apiKey) {
    const prompt = `You are an expert data extractor. Extract all questions from this image.
Return ONLY a JSON array of objects. Do not include markdown blocks, just raw JSON.
Format of each object:
{
  "question": "Question text here",
  "options": {
    "A": "Option A text",
    "B": "Option B text",
    "C": "Option C text",
    "D": "Option D text"
  },
  "correct": "A", // Or B, C, D (extract from the 'Answer:' text in the image)
  "explanation": "Extracted explanation or just correct answer text"
}`;
    
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
          ]
        }],
        generationConfig: {
          response_mime_type: "application/json"
        }
      })
    });
    
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    
    let text = data.candidates[0].content.parts[0].text;
    return JSON.parse(text);
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    const apiKey = document.getElementById('apiKey').value;
    const files = document.getElementById('folderInput').files;
    const topic = document.getElementById('topicName').value;
    
    if (!apiKey) return alert("Please enter API Key");
    if (!files.length) return alert("Please select a folder");
    
    document.getElementById('startBtn').disabled = true;
    log(`Starting extraction for ${files.length} files...`);
    
    let imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
    log(`Found ${imageFiles.length} images.`);
    
    for (let i = 0; i < imageFiles.length; i++) {
      try {
        log(`Processing image ${i+1}/${imageFiles.length}: ${imageFiles[i].name}...`);
        const base64 = await fileToBase64(imageFiles[i]);
        const questions = await processImage(base64, apiKey);
        log(`Extracted ${questions.length} questions from ${imageFiles[i].name}`);
        allQuestions.push(...questions);
      } catch (err) {
        log(`Error on ${imageFiles[i].name}: ${err.message}`);
      }
    }
    
    log(`Extraction complete! Total questions extracted: ${allQuestions.length}`);
    
    // Group into 50 questions per mock
    const mocks = [];
    for (let i = 0; i < allQuestions.length; i += 50) {
      mocks.push(allQuestions.slice(i, i + 50));
    }
    
    log(`Created ${mocks.length} mocks for topic ${topic}.`);
    
    window.generatedMocks = mocks;
    window.generatedTopic = topic;
    document.getElementById('downloadBtn').style.display = 'inline-block';
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    window.generatedMocks.forEach((mock, index) => {
      const blob = new Blob([JSON.stringify(mock, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mock_${window.generatedTopic}_${index + 1}.json`;
      a.click();
    });
    log("Downloaded JSON files. Please place them in your project directory.");
  });
</script>
</body>
</html>
